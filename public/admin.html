<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>پنل مدیریت سیستم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f0d;--bg-2:#141e1a;--bg-3:#1b2721;--bg-3-hover:#20302a;
  --border:#22302a;--border-soft:#182420;
  --accent:#25e37f;--accent-dim:#1aa860;--accent-ink:#00190f;--accent-glow:rgba(37,227,127,.16);
  --text:#eef6f1;--text-dim:#8ea299;--text-faint:#576860;
  --danger:#f2596b;--danger-soft:rgba(242,89,107,.14);
  --warning:#f0b640;--warning-soft:rgba(240,182,64,.14);
  --info:#4fb3e8;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
::selection{background:var(--accent-glow)}

#loginWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100}
.login-box{width:min(92vw,380px);background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 24px;text-align:center}
.brandmark{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(150deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:26px}
.login-box h1{font-size:19px;margin:0 0 6px}
.login-box p{color:var(--text-dim);font-size:13px;margin:0 0 18px}
.field{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-3);color:var(--text);font-size:15px;outline:none;text-align:center;letter-spacing:1px}
.field:focus{border-color:var(--accent)}
.btn-main{width:100%;margin-top:14px;padding:13px;border:none;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer}
.btn-main:active{transform:scale(.98)}
.login-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:10px}

header{position:sticky;top:0;z-index:50;background:rgba(14,21,18,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft);padding:14px 16px;display:flex;align-items:center;gap:12px}
header .brandmark{width:36px;height:36px;border-radius:11px;margin:0;font-size:18px;flex-shrink:0}
header .titles{flex:1;min-width:0}
header .titles h1{font-size:16px;margin:0;line-height:1.3}
header .titles .sub{font-size:11.5px;color:var(--text-dim)}
.btn-exit{background:var(--bg-3);border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;flex-shrink:0}
.btn-exit:hover{background:var(--bg-3-hover);color:var(--danger)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;max-width:1100px;margin:0 auto}
.stat{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--accent)}
.stat .l{font-size:11.5px;color:var(--text-dim);margin-top:3px}
.stat.warn .n{color:var(--warning)}
.stat.info .n{color:var(--info)}

main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.sec-title h2{font-size:15px;margin:0}
.hint-cloud{font-size:11.5px;color:var(--text-faint)}
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.card.blocked-c{border-color:rgba(242,89,107,.45)}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:13px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--text-dim);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.chead .who{flex:1;min-width:150px}
.chead .name{font-weight:700;font-size:15px}
.chead .mail{font-size:12px;color:var(--text-dim);direction:ltr;text-align:right;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:5px 10px;border-radius:20px;background:var(--bg-3);color:var(--text-dim);margin-top:5px;margin-inline-end:4px}
.chip.on{background:var(--accent-glow);color:var(--accent)}
.chip.off{background:var(--danger-soft);color:var(--danger)}
.chip.dim{color:var(--text-faint)}
.chead .meta{text-align:left;font-size:11.5px;color:var(--text-faint)}

.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-3);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:11px 13px}
.ctrl .t{font-size:13.5px}
.ctrl .d{font-size:10.5px;color:var(--text-faint);margin-top:2px}
.sw{position:relative;width:42px;height:24px;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw .track{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.2s}
.sw .knob{position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + .track{background:var(--accent)}
.sw input:checked + .track + .knob{transform:translateX(-18px)}
.sw.danger input:checked + .track{background:var(--danger)}
.sw.warn input:checked + .track{background:var(--warning)}
.sw:has(input:disabled){opacity:.45}

.note-wrap{margin-top:10px}
.note-wrap textarea{width:100%;background:var(--bg-3);border:1px solid var(--border-soft);border-radius:var(--r-sm);color:var(--text);padding:10px 12px;font-size:13px;resize:vertical;min-height:44px;outline:none}
.cfoot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-save{flex:1;min-width:120px;padding:11px;border:none;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer}
.btn-save:active{transform:scale(.98)}
.btn-del{padding:11px 16px;border:1px solid rgba(242,89,107,.4);background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);font-size:13.5px;cursor:pointer}
.empty{color:var(--text-faint);text-align:center;padding:40px 0;font-size:14px}

#deletedWrap{display:none}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;margin-bottom:8px;font-size:12.5px}
.drow code{color:var(--text-dim);direction:ltr}
.btn-restore{background:var(--bg-3);border:1px solid var(--border);color:var(--info);padding:7px 12px;border-radius:var(--r-sm);font-size:12.5px;cursor:pointer}

#toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:var(--bg-3);border:1px solid var(--accent);color:var(--text);padding:11px 22px;border-radius:30px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;bottom:32px}
#toast.err{border-color:var(--danger)}

@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="login-box">
    <div class="brandmark">🛡️</div>
    <h1>پنل مدیریت سیستم</h1>
    <p>کلید مدیریت را وارد کنید</p>
    <input class="field" id="keyInput" type="password" placeholder="کلید مدیریت" autocomplete="off">
    <div class="login-err" id="loginErr"></div>
    <button class="btn-main" onclick="tryLogin()">ورود به پنل مدیریت</button>
  </div>
</div>

<header id="appHead" style="display:none">
  <div class="brandmark">🛡️</div>
  <div class="titles">
    <h1>پنل مدیریت</h1>
    <div class="sub">مدیریت کاربران و امکانات سیستم</div>
  </div>
  <button class="btn-exit" onclick="logout()">خروج</button>
</header>

<div class="stats" id="statsRow" style="display:none">
  <div class="stat"><div class="n" id="stUsers">۰</div><div class="l">کاربر</div></div>
  <div class="stat"><div class="n" id="stBots">۰</div><div class="l">واتساپ متصل</div></div>
  <div class="stat info"><div class="n" id="stReceipts">۰</div><div class="l">کل فیش‌ها</div></div>
  <div class="stat warn"><div class="n" id="stPower">۰</div><div class="l">قدرت AI (دقیقه)</div></div>
</div>

<main id="mainWrap" style="display:none">
  <div class="sec-title">
    <h2>👥 کاربران</h2>
    <span class="hint-cloud" id="cloudHint"></span>
  </div>
  <div id="usersList"></div>

  <div class="sec-title" id="deletedHead" style="display:none">
    <h2>🗑️ حذف‌شده‌ها</h2>
    <span class="hint-cloud">با بازگرداندن اجازه، اگر دوباره وارد شوند از نو شروع می‌کنند</span>
  </div>
  <div id="deletedWrap"><div id="deletedList"></div></div>
</main>

<div id="toast"></div>

<script>
let ADMIN_KEY = localStorage.getItem("adminKey") || "";
let overview = null;
let editingGid = null;
let refreshTimer = null;

function fa(n){ return Number(n || 0).toLocaleString("fa-IR"); }
function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isErr ? "err show" : "show";
  setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(path, body){
  const opt = { headers: { "x-admin-key": ADMIN_KEY } };
  if(body !== undefined){ opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api/admin/" + path, opt);
  const d = await r.json().catch(() => ({}));
  if(r.status === 401){ showLogin("کلید نامعتبر است"); throw new Error("401"); }
  return d;
}

function showLogin(err){
  clearInterval(refreshTimer);
  document.getElementById("loginWrap").style.display = "flex";
  document.getElementById("appHead").style.display = "none";
  document.getElementById("statsRow").style.display = "none";
  document.getElementById("mainWrap").style.display = "none";
  if(err) document.getElementById("loginErr").textContent = err;
}

async function tryLogin(){
  const v = document.getElementById("keyInput").value.trim();
  if(!v) return;
  ADMIN_KEY = v;
  try{
    await api("overview");
    localStorage.setItem("adminKey", v);
    document.getElementById("loginErr").textContent = "";
    document.getElementById("keyInput").value = "";
    enterApp();
  }catch(e){}
}
document.getElementById("keyInput").addEventListener("keydown", e => { if(e.key === "Enter") tryLogin(); });

function logout(){
  localStorage.removeItem("adminKey");
  ADMIN_KEY = "";
  showLogin();
}

async function enterApp(){
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("appHead").style.display = "flex";
  document.getElementById("statsRow").style.display = "grid";
  document.getElementById("mainWrap").style.display = "block";
  await refresh();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refresh, 8000);
}

async function refresh(){
  try{
    const d = await api("overview");
    if(!d.ok) return;
    overview = d;
    document.getElementById("stUsers").textContent = fa(d.stats.total);
    document.getElementById("stBots").textContent = fa(d.stats.active) + "/" + fa(d.stats.maxBots);
    const totRec = d.users.reduce((s, u) => s + u.receipts, 0);
    document.getElementById("stReceipts").textContent = fa(totRec);
    document.getElementById("stPower").textContent = fa(d.stats.ai && d.stats.ai.totalPower);
    document.getElementById("cloudHint").textContent = d.stats.cloud ? "☁️ بکاپ ابری فعال" : "⚠️ بکاپ ابری غیرفعال";
    renderUsers(d.users);
    renderDeleted(d.deleted || []);
  }catch(e){}
}

function stateChip(u){
  const chips = [];
  if(u.overrides.blocked) chips.push('<span class="chip off">⛔ مسدود</span>');
  chips.push(u.overrides.allowDup === false ? '<span class="chip off">📋 فیش تکراری: قفل</span>' : '<span class="chip on">📋 فیش تکراری</span>');
  chips.push(u.overrides.allowConfirm === false ? '<span class="chip off">✅ تأیید: قفل</span>' : '<span class="chip on">✅ تأیید</span>');
  if(u.overrides.forceConfirm) chips.push('<span class="chip" style="background:var(--warning-soft);color:var(--warning)">🔒 تأیید اجباری</span>');
  chips.push(u.connected ? '<span class="chip on">🟢 متصل</span>' : '<span class="chip dim">⚪ قطع</span>');
  return chips.join(" ");
}

function sw(id, label, desc, val, cls){
  return '<div class="ctrl"><div><div class="t">' + label + '</div><div class="d">' + desc + '</div></div>' +
    '<label class="sw ' + (cls || "") + '"><input type="checkbox" id="' + id + '"' + (val ? " checked" : "") + '><span class="track"></span><span class="knob"></span></label></div>';
}

function renderUsers(list){
  const wrap = document.getElementById("usersList");
  if(!list.length){ wrap.innerHTML = '<div class="empty">هنوز کاربری ثبت‌نام نکرده است</div>'; return; }
  wrap.innerHTML = list.map(u => {
    if(u.gid === editingGid) return "";
    const initials = (u.name || u.email || "?").trim().slice(0, 1).toUpperCase();
    const av = u.picture ? '<img src="' + u.picture + '" referrerpolicy="no-referrer">' : esc(initials);
    const dt = new Date(u.lastSeen);
    const seen = u.lastSeen ? dt.toLocaleDateString("fa-IR") + " " + dt.toLocaleTimeString("fa-IR", {hour:"2-digit", minute:"2-digit"}) : "—";
    const ov = u.overrides;
    return '<div class="card' + (ov.blocked ? " blocked-c" : "") + '">'
      + '<div class="chead">'
      + '<div class="avatar">' + av + '</div>'
      + '<div class="who"><div class="name">' + esc(u.name || "بی‌نام") + '</div><div class="mail">' + esc(u.email || "") + '</div>'
      + stateChip(u)
      + (u.botNumber ? '<span class="chip">📱 ' + esc(u.botNumber) + '</span>' : "")
      + '</div>'
      + '<div class="meta">فیش: ' + fa(u.receipts) + '<br>گروه هدف: ' + fa(u.targetGroups) + '<br>آخرین ورود: ' + seen + '</div>'
      + '</div>'
      + '<div class="ctrls">'
      + sw("sw-dup-" + u.gid, "📋 بخش فیش تکراری", "اسکن گروه‌ها و تشخیص فیش تکراری", ov.allowDup !== false)
      + sw("sw-conf-" + u.gid, "✅ بخش فیش به تأیید", "ارسال فیش‌ها به تأییدکننده", ov.allowConfirm !== false)
      + sw("sw-force-" + u.gid, "🔒 تأیید اجباری", "کاربر نمی‌تواند تأیید را خاموش کند", ov.forceConfirm, "warn")
      + sw("sw-block-" + u.gid, "⛔ مسدودسازی کامل", "قطع پنل + خروج واتساپ (فقط این مورد واتساپ را قطع می‌کند)", ov.blocked, "danger")
      + '</div>'
      + '<div class="note-wrap"><textarea id="note-' + u.gid + '" placeholder="یادداشت مدیریت (اختیاری)">' + esc(ov.note || "") + '</textarea></div>'
      + '<div class="cfoot">'
      + '<button class="btn-save" onclick="saveUser(\'' + u.gid + '\')">💾 ذخیره تنظیمات</button>'
      + '<button class="btn-del" onclick="delUser(\'' + u.gid + '\')">🗑️ حذف کاربر</button>'
      + '</div></div>';
  }).join("");
}

function renderDeleted(list){
  const wrap = document.getElementById("deletedWrap");
  document.getElementById("deletedHead").style.display = list.length ? "flex" : "none";
  wrap.style.display = list.length ? "block" : "none";
  wrap.innerHTML = list.map(g =>
    '<div class="drow"><code>' + esc(g.slice(0, 12)) + '…</code>' +
    '<button class="btn-restore" onclick="restoreUser(\'' + g + '\')">↩️ بازگرداندن اجازه ورود</button></div>'
  ).join("");
}

async function saveUser(gid){
  const body = {
    gid,
    allowDup: document.getElementById("sw-dup-" + gid).checked,
    allowConfirm: document.getElementById("sw-conf-" + gid).checked,
    forceConfirm: document.getElementById("sw-force-" + gid).checked,
    blocked: document.getElementById("sw-block-" + gid).checked,
    note: document.getElementById("note-" + gid).value
  };
  try{
    const d = await api("user", body);
    if(d.ok) toast("✅ ذخیره شد — اتصال واتساپ کاربر قطع نشد");
    else toast(d.error || "خطا", true);
    await refresh();
  }catch(e){}
}

async function delUser(gid){
  if(!confirm("این کاربر حذف شود؟ اتصال واتساپ قطع و داده‌های محلی پاک می‌شود.")) return;
  if(!confirm("مطمئنی؟ این کاربر باید دوباره وارد شود و از اول تنظیم کند.")) return;
  try{
    const d = await api("user-delete", { gid });
    if(d.ok){ toast("🗑️ کاربر حذف شد"); await refresh(); }
    else toast(d.error || "خطا", true);
  }catch(e){}
}

async function restoreUser(gid){
  try{
    await api("user-restore", { gid });
    toast("↩️ اجازه ورود بازگشت");
    await refresh();
  }catch(e){}
}

document.addEventListener("focusin", e => {
  const m = e.target.id && e.target.id.match(/^sw-|^note-/);
  if(m) editingGid = e.target.id.replace(/^sw-(dup|conf|force|block)-/, "").replace(/^note-/, "");
});
document.addEventListener("focusout", () => { setTimeout(() => { if(!document.activeElement || !document.activeElement.id || !document.activeElement.id.match(/^sw-|^note-/)) editingGid = null; }, 100); });

(async () => {
  if(ADMIN_KEY){
    try{ await api("overview"); enterApp(); return; }catch(e){}
  }
  showLogin();
})();
</script>
</body>
</html>
