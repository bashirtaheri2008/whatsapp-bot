name: Windows Cloud RDP

# اجرای دستی: تب Actions → Windows Cloud RDP → Run workflow
# مدت: حداکثر 6 ساعت، بعدش کل ماشین پاک می‌شود
# لازم: Secret با نام TAILSCALE_AUTHKEY (کلید از tailscale.com)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin"

      - name: 3. Install Tailscale
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile 'tailscale-setup.exe'
          Start-Process -Wait -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet"

      - name: 4. Connect Tailscale & Show IP
        shell: powershell
        run: |
          $authkey = "${{ secrets.TAILSCALE_AUTHKEY }}"
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { $ts = "C:\Program Files (x86)\Tailscale\tailscale.exe" }
          Start-Process -FilePath $ts -ArgumentList "up","--accept-dns=false","--authkey=$authkey" -Wait -NoNewWindow
          Start-Sleep -Seconds 10
          Write-Host "=== TAILSCALE IP (connect with Windows App) ==="
          & $ts ip -4
          & $ts status

      - name: 5. Keep session alive (max ~6h)
        run: |
          $deadline = (Get-Date).AddMinutes(355)
          while((Get-Date) -lt $deadline) { Start-Sleep -Seconds 60 }
